    <style>
        :root {
            --primary: #1B3A5C;
            --accent: #FF8C00;
            --text-light: #6B8BAE;
            --bg-secondary: #F4F7FB;
            --border: #D8E3EE;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg-secondary); color: var(--primary); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 16px; }
        .wrap { max-width: 560px; width: 100%; text-align: center; }
        .logo { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: var(--primary); font-weight: 800; font-size: 22px; margin-bottom: 40px; }
        .logo span { color: var(--accent); }
        .code { font-size: 14px; font-weight: 600; letter-spacing: 0.08em; color: var(--accent); margin-bottom: 12px; }
        h1 { font-size: clamp(28px, 5vw, 40px); font-weight: 800; line-height: 1.15; margin-bottom: 16px; }
        p { color: var(--text-light); font-size: 16px; line-height: 1.6; margin-bottom: 32px; }
        .links { display: grid; gap: 10px; margin-bottom: 28px; text-align: left; }
        .links a { display: block; padding: 14px 18px; background: #fff; border: 1px solid var(--border); border-radius: 12px; color: var(--primary); text-decoration: none; font-weight: 600; transition: border-color .2s, transform .2s; }
        .links a:hover, .links a:focus-visible { border-color: var(--accent); transform: translateY(-2px); }
        .btn { display: inline-block; padding: 14px 24px; background: var(--accent); color: #fff; border-radius: 12px; font-weight: 700; text-decoration: none; }
        .btn:hover, .btn:focus-visible { filter: brightness(1.08); }
    </style>

</head>
